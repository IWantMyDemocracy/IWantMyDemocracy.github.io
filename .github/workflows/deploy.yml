# Rebuilds and publishes www.iwantmydemocracy.com every time something is saved
# (from the online editor or from this folder).
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Reuse resized pictures from earlier builds so publishing stays quick.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-images-

      # Catch code mistakes before publishing (a failed check keeps the last good site live).
      - run: npm run check

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
